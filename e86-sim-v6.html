<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>e86 簡易シミュレーター</title>
<style>
:root{--bg:#0d0f14;--panel:#1a1d26;--tx:#f1f3f6;--sub:#9aa4b2;--line:#2d3340;--red:#ff3b30;--blue:#35a7ff;--gold:#ffd23f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#e6e9ee;--panel:#fff;--tx:#1a1f26;--sub:#5d6772;--line:#c9cfd8}}
:root[data-theme="light"]{--bg:#e6e9ee;--panel:#fff;--tx:#1a1f26;--sub:#5d6772;--line:#c9cfd8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:12px}
h1{font-size:16px;margin:2px 0 8px;color:var(--sub);font-weight:600}
.lcd{border:4px solid #8a8f9a;border-radius:14px;padding:12px;color:#fff;box-shadow:0 0 0 3px #2a2d35,inset 0 0 30px rgba(0,0,0,.5);transition:background .3s}
.lcd[data-mode=normal]{background:linear-gradient(#0c1634,#1b2f6b)}
.lcd[data-mode=chal]{background:linear-gradient(#4a2a00,#c27a00)}
.lcd[data-mode=rush]{background:linear-gradient(#3c0710,#c4202c)}
.lcd[data-mode=judge]{background:linear-gradient(#1f0b40,#7a35d6)}
.lcd[data-mode=jm]{background:linear-gradient(#06302e,#13a08f)}
.lcd[data-mode=kiryu]{background:linear-gradient(#5a3d00,#f2b820)}
.banner{text-align:center;font-weight:900;font-size:22px;letter-spacing:.04em;text-shadow:0 2px 6px #000}
.tot{width:fit-content;margin:6px auto 0;padding:2px 14px;background:rgba(0,0,0,.5);border-radius:8px;font-weight:800;color:var(--gold);text-shadow:0 2px 6px #000}
.tot b{font:900 30px ui-monospace,Menlo,monospace;margin:0 3px;font-variant-numeric:tabular-nums}
.msg{text-align:center;font-weight:700;font-size:17px;min-height:30px;margin:6px 0 10px;color:var(--gold);text-shadow:0 1px 4px #000}
.reels{display:flex;justify-content:center;gap:10px;margin:6px 0 4px}
.reels b{width:64px;height:84px;display:grid;place-items:center;font-size:56px;background:#fff;color:#111;border-radius:8px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.reels.win b{background:var(--gold);color:#c00}
.side{background:rgba(0,0,0,.45);border-radius:10px;padding:8px 10px;margin:8px 0}
.top{display:flex;justify-content:space-between;align-items:baseline}
.top .l{font-weight:800;font-size:15px}
.top .n{font-size:44px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 2px 6px #000}
.side.e .l,.side.e .n{color:#ff6b61}
.side.m .l,.side.m .n{color:#6cc0ff}
.blocks{display:flex;gap:6px;margin-top:6px}
.blk{flex:1;height:30px;border:3px solid currentColor;box-sizing:border-box}
.e .blk{color:#ff6b61;border-radius:4px}
.m .blk{color:#6cc0ff;border-radius:50%}
.blk.on{background:currentColor;box-shadow:0 0 10px currentColor}
.blk.off{opacity:.25;border-style:dashed}
.lcd.drawing .side{animation:scan .25s infinite alternate}
@keyframes scan{from{box-shadow:0 0 0 rgba(255,255,255,0)}to{box-shadow:0 0 16px rgba(255,255,255,.7)}}
.lcd.cue-enemy{animation:cueR .4s 3}
.lcd.cue-self{animation:cueB .4s 3}
.lcd.cue-one{animation:cueG .3s 5}
.lcd.cue-enemy .msg{color:#ff5a50}.lcd.cue-self .msg{color:#7fd0ff}
@keyframes cueR{50%{box-shadow:0 0 0 3px #2a2d35,inset 0 0 90px rgba(255,0,0,.95)}}
@keyframes cueB{50%{box-shadow:0 0 0 3px #2a2d35,inset 0 0 90px rgba(40,150,255,.95)}}
@keyframes cueG{50%{box-shadow:0 0 0 3px #2a2d35,inset 0 0 100px rgba(255,210,60,1)}}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px}
.modes button.on{background:var(--red);border-color:var(--red);color:#fff}
.mn{font-size:12px;color:var(--sub);text-align:center;min-height:36px}
.side.jm .l,.side.jm .n{color:var(--gold)}
.gauge{height:14px;background:rgba(255,255,255,.2);border-radius:7px;margin-top:8px;overflow:hidden}
.gauge i{display:block;height:100%;width:55%;background:var(--gold)}
.lcd.hurt{animation:hurt .6s}
@keyframes hurt{0%,100%{transform:none}10%{transform:translate(-9px,3px)}20%{transform:translate(9px,-3px)}30%{transform:translate(-7px,2px)}40%{transform:translate(7px,-2px)}50%{transform:translate(-3px,1px);box-shadow:0 0 0 3px #2a2d35,inset 0 0 110px rgba(255,0,0,.95)}}
.lcd{position:relative;overflow:hidden}
.fx{position:absolute;left:0;right:0;top:34%;text-align:center;font:900 54px/1 "Hiragino Sans","Noto Sans JP",sans-serif;color:#ff3b30;text-shadow:0 0 18px #000,0 0 6px #fff;opacity:0;pointer-events:none;z-index:2}
.fx.go{animation:fxA .9s}
@keyframes fxA{0%{opacity:0;transform:scale(2.4)}20%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
.blk.lost{animation:lostA .9s}
@keyframes lostA{0%{background:#fff;transform:scale(1.6) rotate(10deg);opacity:1}40%{background:#ff3b30;transform:scale(1.25) rotate(-10deg)}100%{transform:none}}
.flash{animation:fl .5s}
@keyframes fl{0%{filter:brightness(3);transform:scale(1.04)}100%{filter:none;transform:none}}
@media(prefers-reduced-motion:reduce){.flash,.lcd.drawing .side,.lcd[class*=cue-],.lcd.hurt,.fx.go,.blk.lost{animation:none}}
.shot{display:block;margin:14px auto 10px;width:132px;height:132px;border-radius:50%;border:6px solid #b8bcc6;background:radial-gradient(circle at 35% 30%,#ff7a70,#c81e14);color:#fff;font:900 20px/1.2 inherit;box-shadow:0 6px 0 #7a110b}
.shot:active{transform:translateY(4px);box-shadow:0 2px 0 #7a110b}
.sub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
button.s{font:inherit;font-weight:700;font-size:13px;padding:10px 4px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--tx)}
button:disabled{opacity:.35}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.data{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.data div{background:#000;border:2px solid #444;border-radius:6px;padding:6px 8px}
.data small{display:block;color:#ff9f0a;font-size:11px}
.data b{color:#7dff7d;font:700 18px/1.2 ui-monospace,Menlo,monospace}
#log{list-style:none;margin:0;padding:0;font-size:13px;max-height:220px;overflow-y:auto}
#log li{padding:5px 0;border-bottom:1px solid var(--line)}
#log .big{color:#ff6b61;font-weight:700}
.note{color:var(--sub);font-size:11px;margin:10px 0 0}
.head{display:flex;justify-content:space-between;align-items:center}
.head h1{margin:0}
#b6{padding:6px 10px;font-size:12px}
.hist{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#000;border:2px solid #444;border-radius:8px;padding:6px 8px;margin:8px 0 10px;min-height:34px}
.hist small{color:#ff9f0a;font-size:11px;margin-right:2px}
.hist span{color:#7dff7d;font:700 15px ui-monospace,Menlo,monospace;border:1px solid #2f6b2f;border-radius:4px;padding:1px 6px}
.hist span:first-of-type{font-size:20px;background:#164a16;border-color:#7dff7d}

.lcd.hasst[data-mode]{background:linear-gradient(#070a28,#150f4a)}
.stage{position:relative;width:100%;container-type:inline-size;border-radius:8px;overflow:hidden;margin-top:6px;background:radial-gradient(ellipse at 50% 42%,#27329e 0,#0b0f4d 55%,#05061f 100%);box-shadow:inset 0 0 40px rgba(0,0,0,.6);font-size:12px;font-size:2.6cqw}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(80,160,255,.07) 0 1px,transparent 1px 4px);pointer-events:none}
.stage.A{aspect-ratio:1.16/1}.stage.B{aspect-ratio:1.3/1}
.dm{position:absolute;aspect-ratio:1;display:grid;place-items:center}
.dm i{position:absolute;inset:0;transform:rotate(45deg);box-sizing:border-box;border:.7cqw solid var(--c);background:var(--bg);box-shadow:0 0 2cqw var(--c),inset 0 0 2cqw var(--c)}
.dm .dt{position:relative;text-align:center;color:#fff;font-weight:800;line-height:1}
.dm.blue{--c:#35a7ff;--bg:linear-gradient(135deg,#0b2a66,#0a1a44)}
.dm.red{--c:#ff3b5c;--bg:linear-gradient(135deg,#6a0d22,#3a0614)}
.dm.dead{opacity:.28;filter:grayscale(.8)}
.dm.en .dt{font-size:2.1cqw;color:#bfe3ff;letter-spacing:.02em}
.dm.cnt .dt small{display:block;font-size:2.3cqw;margin-bottom:.6cqw}
.dm.cnt .dt b{display:block;font:900 11cqw/1 "Arial Black",system-ui,sans-serif}
.stage.B .dm.cnt .dt b{font-size:9cqw}
.dm.red.cnt .dt{color:#ff9bb0}.dm.red.cnt .dt b{text-shadow:0 0 2cqw #ff3b5c}
.dm.blue.cnt .dt{color:#a9dcff}.dm.blue.cnt .dt b{text-shadow:0 0 2cqw #35a7ff}
.pn{position:absolute;box-sizing:border-box;overflow:hidden;background:linear-gradient(120deg,hsl(var(--h) 60% 20%),hsl(var(--h) 55% 40%));box-shadow:inset 0 0 0 .5cqw #ff4d70}
.stage.A .pn{clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%)}
.stage.B .pn{clip-path:polygon(8% 0,100% 0,92% 100%,0 100%)}
.pn.c0{--h:8}.pn.c1{--h:220}.pn.c2{--h:262}.pn.c3{--h:42}.pn.c4{--h:350}
.pn em{position:absolute;left:3cqw;top:1cqw;font:700 2.4cqw/1 system-ui,sans-serif;font-style:normal;color:#fff;opacity:.9}
.pn .av{position:absolute;left:8%;top:12%;bottom:0;width:58%;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.5) 0 17%,transparent 18%),radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.32) 0 48%,transparent 49%)}
.pn b{position:absolute;right:11%;bottom:0;background:rgba(0,0,0,.68);padding:.4cqw 1.4cqw;font:700 1.9cqw/1.2 system-ui,sans-serif;color:#fff;white-space:nowrap}
.stage.B .pn b{left:0;right:0;text-align:center;font-size:1.6cqw;padding:.3cqw 0}
.pn u{position:absolute;inset:0;display:grid;place-items:center;text-decoration:none;color:#ff5fd2;font:900 3cqw system-ui,sans-serif;text-shadow:0 0 1cqw #f0f}
.pn.dead{filter:saturate(.2) brightness(.5)}
.pn.lostnow,.dm.lostnow{animation:lostA .9s}
.nt{position:absolute;border:.5cqw solid #d9a91c;background:#2a1c00;box-shadow:0 0 2cqw rgba(255,190,40,.5);z-index:1}
.nh{background:#3a2800;color:#ffd23f;text-align:center;font-weight:800;font-size:2.4cqw;padding:.6cqw 0}
.nb{padding:.8cqw 0 1cqw;text-align:center}
.eye{display:block;width:8cqw;height:8cqw;margin:.4cqw auto .8cqw;border-radius:50%;background:radial-gradient(circle,#ff2a2a 0 22%,#fff 24% 40%,#d6d6d6 42% 70%,#8a8a8a 72%)}
.eye.red{background:radial-gradient(circle,#ff8a8a 0,#ff1f1f 45%,#9a0000 100%);box-shadow:0 0 3cqw #ff2a2a}
.eye.white{background:radial-gradient(circle,#fff 0,#f3f3f3 55%,#c8c8c8 100%);box-shadow:0 0 3cqw #fff}
.eye.bl{animation:eyeb .3s steps(1) infinite}
@keyframes eyeb{0%{opacity:1}50%{opacity:.12;box-shadow:none}}
.ntc{display:block;margin:0 .8cqw;background:#0e0e0e;border:1px solid #6a5a20;color:#fff;font-weight:800;font-size:2.6cqw;padding:.5cqw 0}
.logo{position:absolute;left:25%;width:50%;top:79%;text-align:center;font:900 italic 2.5cqw/1 system-ui,sans-serif;color:#fff;letter-spacing:.03em;text-shadow:0 0 1.5cqw #6cf;white-space:nowrap}
.logo b{font-size:4cqw;color:#ff5a6e}
.bar{position:absolute;display:grid;place-items:center;text-align:center;overflow:hidden;line-height:1.15;border:.5cqw solid #ff3b5c;background:rgba(40,0,15,.78);color:#ffd0d8;font-weight:800;box-shadow:0 0 2cqw rgba(255,60,90,.6);font-size:2.6cqw}
.stage.A .bar{left:25%;width:50%;top:89%;height:9.5%}
.stage.B .bar{left:28%;width:44%;top:68%;height:9%}
.bar.st{font-size:6.5cqw;font-style:italic;letter-spacing:.1em;color:#ff3b5c;text-shadow:0 0 2cqw #f00}
.hud{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(80,170,255,.8) 40%,rgba(80,170,255,.8) 60%,transparent) 0 30%/100% 1px no-repeat,linear-gradient(0deg,transparent,rgba(80,170,255,.7),transparent) 50% 0/1px 100% no-repeat,radial-gradient(circle at 50% 33%,transparent 0 3.2cqw,rgba(120,200,255,.9) 3.3cqw 3.9cqw,transparent 4cqw)}
.rg{position:absolute;left:0;right:0;top:36%;display:flex;justify-content:center;gap:2cqw}
.rg b{width:15cqw;text-align:center;font:900 italic 21cqw/1 "Arial Black",Impact,system-ui,sans-serif;color:#eaf6ff;-webkit-text-stroke:.5cqw #4aa8ff;text-shadow:0 0 3cqw #35a7ff}
@media(prefers-reduced-motion:reduce){.pn.lostnow,.dm.lostnow{animation:none}}

.ichi{position:absolute;inset:0;z-index:6;display:none;opacity:0;background:#000;transition:opacity .4s;container-type:inline-size;overflow:hidden;border-radius:10px}
.ichi.on{display:block;opacity:1}
.ichi.rev{cursor:pointer}
.ichi.out{opacity:0;transition:opacity .8s ease-in;pointer-events:none}
.ichi .sc{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at 36% 58%,#ff3a22 0,#a80f18 45%,#2a0208 100%);overflow:hidden}
.ichi.rev .sc{opacity:1;animation:icflash .7s,icshake .5s}
.ichi.out .sc{transform:scale(1.12);transition:transform .8s ease-in}
@keyframes icflash{0%{filter:brightness(3.4) saturate(.3)}100%{filter:none}}
@keyframes icshake{0%,100%{transform:none}15%{transform:translate(-2cqw,1cqw)}30%{transform:translate(2cqw,-1cqw)}45%{transform:translate(-1.2cqw,.6cqw)}60%{transform:translate(1cqw,-.5cqw)}}
.ichi .rays{position:absolute;left:36%;top:58%;width:300cqw;height:300cqw;margin:-150cqw 0 0 -150cqw;background:repeating-conic-gradient(rgba(255,214,120,.30) 0 5deg,transparent 5deg 10deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 52%);mask-image:radial-gradient(circle,#000 0,transparent 52%);animation:icspin 16s linear infinite}
@keyframes icspin{to{transform:rotate(360deg)}}
.ichi .glow{position:absolute;left:36%;top:58%;width:80cqw;height:80cqw;margin:-40cqw 0 0 -40cqw;border-radius:50%;background:radial-gradient(circle,rgba(255,235,160,.85) 0,rgba(255,140,50,.35) 35%,transparent 68%);animation:icbreath 1.1s ease-in-out infinite alternate}
@keyframes icbreath{to{transform:scale(1.18);opacity:.75}}
.ichi .sc::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 4px),radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.65) 100%)}
.ichi .spk{position:absolute;bottom:-3cqw;width:1.3cqw;height:1.3cqw;border-radius:50%;background:#ffd86a;box-shadow:0 0 2cqw #ff9a2a;opacity:0;animation:icrise 3.2s linear infinite}
@keyframes icrise{0%{transform:translateY(0);opacity:0}12%{opacity:1}100%{transform:translateY(-120cqw) translateX(6cqw);opacity:0}}
.ichi .hd{position:absolute;left:0;top:5cqw;width:72cqw;padding:2.2cqw 14cqw 2.2cqw 6cqw;background:linear-gradient(90deg,rgba(10,2,6,.92),rgba(40,6,16,.85) 80%,transparent);border-top:.5cqw solid #ff5468;border-bottom:.5cqw solid #ff5468;clip-path:polygon(0 0,100% 0,88% 100%,0 100%);z-index:3}
.ichi .hd b{display:block;font:900 italic 6.4cqw/1 system-ui,sans-serif;color:#fff;letter-spacing:.08em;text-shadow:0 0 2cqw #ff4a5c}
.ichi .hd small{display:block;margin-top:1.2cqw;font:700 3cqw/1 system-ui,sans-serif;color:#ffc9a0;letter-spacing:.3em}
.ichi .cn{position:absolute;width:9cqw;height:9cqw;border:0 solid #ffd27a;z-index:3;opacity:.9}
.ichi .cn.a{right:3cqw;top:3cqw;border-top-width:.9cqw;border-right-width:.9cqw}
.ichi .cn.b{left:3cqw;bottom:3cqw;border-bottom-width:.9cqw;border-left-width:.9cqw}
.ichi .cn.c{right:3cqw;bottom:3cqw;border-bottom-width:.9cqw;border-right-width:.9cqw}
.ichi .kj{position:absolute;right:1.5cqw;top:6%;writing-mode:vertical-rl;font:900 35cqw/1 "Hiragino Sans","Noto Sans JP",sans-serif;letter-spacing:-.04em;color:#ffd24a;-webkit-text-stroke:.9cqw #7a2a00;paint-order:stroke fill;text-shadow:0 .7cqw 0 #d9780c,0 1.4cqw 0 #b25a00,0 2.1cqw 0 #8a3f00,0 3cqw 1.5cqw rgba(0,0,0,.55),0 0 7cqw rgba(255,190,60,.95);z-index:2}
.ichi.rev .kj{animation:icslam .55s cubic-bezier(.2,1.4,.4,1) both,icpulse2 1.2s ease-in-out .6s infinite alternate}
@keyframes icslam{0%{transform:scale(3);opacity:0}60%{opacity:1}100%{transform:scale(1)}}
@keyframes icpulse2{to{filter:brightness(1.25)}}
.push{position:absolute;left:36%;top:57%;width:48cqw;height:48cqw;margin:-24cqw 0 0 -24cqw;padding:0;border:0;background:none;cursor:pointer;z-index:4;-webkit-tap-highlight-color:transparent}
.push::before{content:"";position:absolute;inset:-9%;border:.7cqw dashed rgba(255,232,170,.95);border-radius:50%;animation:icspin 7s linear infinite}
.push::after{content:"";position:absolute;inset:0;border:.8cqw solid rgba(255,220,140,.9);border-radius:50%;animation:icring 1.3s ease-out infinite}
@keyframes icring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.push .bs{position:absolute;left:4%;right:4%;bottom:4%;height:40%;border-radius:50%;background:linear-gradient(#2b2b2f,#050507);box-shadow:0 0 0 .8cqw #ff4a5c,0 0 4cqw #ff4a5c,0 2cqw 4cqw rgba(0,0,0,.7)}
.push .gl{position:absolute;left:10%;right:10%;top:6%;height:68%;border-radius:50% 50% 46% 46%/62% 62% 38% 38%;background:radial-gradient(ellipse at 38% 22%,rgba(255,255,255,.9) 0,rgba(255,255,255,.15) 22%,transparent 40%),linear-gradient(#ffc9c9 0,#ff6464 38%,#9b1018 100%);box-shadow:inset 0 0 5cqw rgba(255,255,255,.55),0 0 8cqw rgba(255,80,60,.95);transition:transform .08s,filter .08s}
.push .gl::after{content:"";position:absolute;left:24%;right:24%;top:52%;height:28%;border-radius:40%;background:radial-gradient(#ff2a2a 0,#7a0000 100%);box-shadow:0 0 4cqw #f00;animation:icpulse .5s ease-in-out infinite alternate}
@keyframes icpulse{to{filter:brightness(1.9)}}
.push.down .gl{transform:translateY(5cqw) scaleY(.88);filter:brightness(1.7)}
.pl{position:absolute;left:0;width:72%;top:78%;text-align:center;font:900 italic 9cqw/1 system-ui,sans-serif;color:#fff;text-shadow:0 0 3cqw #ffb347,0 0 1cqw #f00,0 .6cqw 0 #8a0010;z-index:4;animation:icblink .5s steps(1) infinite;letter-spacing:.12em}
@keyframes icblink{50%{opacity:.3}}
.ichi.go .pl{animation:none;opacity:1}
.gg{position:absolute;left:6%;width:88%;bottom:4%;z-index:4;display:flex;align-items:center;gap:3cqw}
.gg .fr{flex:1;height:8cqw;clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);background:#ffd27a;padding:.8cqw;box-sizing:border-box}
.gg .fr i{display:block;height:100%;clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);background:#1a0408;position:relative;overflow:hidden}
.gg .fr i b{position:absolute;left:0;top:0;bottom:0;width:100%;background:repeating-linear-gradient(115deg,#ff2a3a 0 2cqw,#ff8a4a 2cqw 3.2cqw,#ffd24a 3.2cqw 5cqw);background-size:6cqw 100%}
.ichi.rev .gg .fr i b{animation:icdrain 6.84s linear forwards,icbar 1s linear infinite}
.ichi.go .gg .fr i b{animation-play-state:paused}
@keyframes icdrain{from{width:100%}to{width:0}}
@keyframes icbar{to{background-position:6cqw 0}}
.ichi.rev:not(.go) .gg{animation:icwarn .3s steps(1) infinite;animation-delay:4.8s}
@keyframes icwarn{50%{filter:brightness(2.2) hue-rotate(-20deg)}}

<script>
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const P={blank:1/3.5,one:1/35,hit:1/239.1,enter:.55,a1:.443,a2:.46,lj:.29,kir:.3,kirc:.7};
let S,busy=false;
function init(){forceOne=false;S={tot:0,hl:[],snd:"",sp:0,ht:0,iv:0,bl:0,cur:0,mx:0,mode:"normal",e:0,m:0,emax:0,n:0,from:"",msg:"打ち出しボタンで回転スタート",dg:[null,null,null],win:false,last:""};$("log").innerHTML="";render();}
function log(t,big){const li=document.createElement("li");li.textContent=t;if(big)li.className="big";$("log").prepend(li);}
function gain(n,t,big){S.bl+=n;S.tot+=n;log(t,big);}
function startChal(){S.mode="chal";S.e=5;S.emax=5;S.m=5;log("突破チャレンジ突入(敵5・味方5)");}
function startRound(){S.mode="rush";S.e=3;S.emax=3;S.m=5;}
function endRush(){S.mx=Math.max(S.mx,S.n);log(`RUSH終了(${S.n}連 合計${S.tot}個)`);S.mode="normal";S.e=S.m=S.emax=0;S.msg="通常時に戻りました";}
function pickK(){const r=Math.random();return r<.256?7500:r<.349?6000:r<.544?4500:r<.882?3000:2700;}
function rushWin(){
S.n++;
const big=S.rw!=null?S.rw:Math.random()<.7;S.rw=null;
if(big){
gain(1500,`虹V ${S.n}連目 +1500個`,true);S.rm="虹V +1500個";
if(Math.random()<P.kir){S.mode="kiryu";S.kt=pickK();S.kg=0;log("キリヤ血戦突入",true);S.rm+=" キリヤ血戦突入!";}
else startRound();
}else{
gain(300,`金V ${S.n}連目 +300個`,true);S.rm="金V +300個";startRound();}}
function digits(hit){
if(hit)return[8,8,8];
const d=[0,0,0].map(()=>Math.floor(Math.random()*9)+1);
if(d[0]===d[1]&&d[1]===d[2])d[2]=d[2]%9+1;
return d;}
function step(){
const s=S,r=Math.random();s.last="";s.snd="";s.win=false;
if(s.mode==="normal"){
s.sp++;s.cur++;s.iv+=1000/18;
if(r<P.hit){
s.dg=digits(true);s.win=true;
s.ht++;s.tot=0;gain(300,`初当り#${s.ht}(${s.cur}回転目) 86BONUS +300個`);s.msg="大当り!86BONUS";s.hl.unshift(s.cur);s.cur=0;
s.mode="jm";log("86BONUS終了 → 突破ジャッジメントへ");s.msg+=" → 突破ジャッジメント";
}else{s.dg=digits(false);s.msg=`${s.cur}回転目 ハズレ`;}
}else if(s.mode==="chal"||s.mode==="rush"){
const o=s.pre||roll();s.pre=null;s.pe=s.e;
if(o==="one"){s.e=0;s.last="e";s.snd="";s.msg="一撃一掃フラグ!! 敵が全滅";}
else if(o==="blank"){s.msg="ハズレフラグ 変化なし";}
else if(o==="atk"){s.e--;s.last="e";s.snd=s.e===0?"":"hit";s.msg="攻撃フラグ! 敵 -1";}
else{s.m--;s.last="m";s.snd="dmg";s.hurt=true;s.msg="被弾フラグ… 味方 -1";}
s.rg=s.e===0?[7,7,7]:digits(false);
if(s.e===0){
if(s.mode==="chal"){log("突破チャレンジ成功");s.n=0;startRound();s.msg="突破成功! RUSH突入";}
else{rushWin();s.msg="敵を殲滅! "+s.rm;}
}else if(s.m===0){s.from=s.mode;s.mode="judge";s.msg="味方全滅… LAST JUDGEへ";}
}else if(s.mode==="judge"){
if(r<P.lj){
log("LAST JUDGE成功",true);s.snd="kill";
if(s.from==="chal"){s.n=0;startRound();s.msg="引き戻し成功! RUSH突入";}
else{rushWin();s.msg="引き戻し成功! "+s.rm;}
}else{
log("LAST JUDGE失敗");s.snd="lose";
if(s.from==="rush")endRush();else{s.mode="normal";s.e=s.m=s.emax=0;s.msg="突破失敗… 通常へ";}
}
}else if(s.mode==="jm"){
if(r<P.enter){log("突破ジャッジメント成功(55%)",true);startChal();s.snd="pachi";s.msg="ジャッジメント成功! 突破チャレンジ突入";}
else{log("突破ジャッジメント失敗");s.mode="normal";s.snd="lose";s.msg="ジャッジメント失敗… 通常へ";}
}else if(s.mode==="kiryu"){
const g=Math.min(1500,s.kt);s.kt-=g;s.kg+=g;gain(g,`キリヤ血戦 上乗せ +${g}個`,true);s.msg=`上乗せ +${g}個`;
if(s.kt<=0){startRound();log(`キリヤ血戦終了(合計 ${s.kg}個)`);s.msg=`血戦終了 合計 ${s.kg}個。RUSH継続`;}
}
}

      const c=ac.createDynamicsCompressor();
      c.threshold.value=-14;c.ratio.value=8;
      mg=ac.createGain();mg.gain.value=1.4;
      mg.connect(c);c.connect(ac.destination);
      const d=ac.createDelay();d.delayTime.value=.16;
      const fb=ac.createGain();fb.gain.value=.35;
      d.connect(fb);fb.connect(d);
      const w=ac.createGain();w.gain.value=.4;
      mg.connect(d);d.connect(w);w.connect(c);
    }
    if(ac.state!=="running"){
      const r=ac.resume();
      if(r&&r.catch)r.catch(()=>{});
    }
    return true;
  }catch(e){return false;}
}
function audioWake(){
  if(!snd)return;
  try{
    if(!boot())return;
    const t=ac.currentTime;
    const o=ac.createOscillator(),g=ac.createGain();
    o.type="sine";o.frequency.value=220;
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.0001,t+.03);
    o.connect(g);g.connect(mg);o.start(t);o.stop(t+.04);
  }catch(e){}
}
function curve(k){const n=256,a=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;a[i]=(1+k)*x/(1+k*Math.abs(x));}return a;}
function osc(type,f1,f2,t,d,v,dist){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);let n=o;if(dist){const w=ac.createWaveShaper();w.curve=curve(dist);o.connect(w);n=w;}n.connect(g);g.connect(mg);o.start(t);o.stop(t+d);}
function noise(t,d,v,type,f){const len=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,len,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<len;i++)a[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.value=f;const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(g);g.connect(mg);s.start(t);}
function sfx(k){if(!snd)return;try{if(!boot()||!ac||ac.state!=="running")return;const t=ac.currentTime;

if(k==="pachi"){if(pb){const s=ac.createBufferSource();s.buffer=pb;s.connect(pg);s.start(t);return;}k="kill";}
if(k==="warn"){osc("sawtooth",150,70,t,.45,.4,60);osc("sawtooth",120,55,t+.2,.5,.4,60);osc("sine",70,28,t,.8,1,0);noise(t,.4,.4,"lowpass",350);}
else if(k==="cues"){osc("square",660,0,t,.14,.2,30);osc("square",990,0,t+.1,.35,.2,30);osc("sine",110,40,t,.6,.9,0);}
else if(k==="tick"){osc("sine",260,0,t,.05,.12,0);}
else if(k==="hit"){osc("sine",170,38,t,.6,1,0);osc("sine",85,30,t+.03,.8,.9,0);noise(t,.14,.5,"bandpass",2200);noise(t,.4,.4,"lowpass",250);osc("square",990,1320,t,.2,.18,30);}
else if(k==="kill"){osc("sine",130,32,t,.9,1.1,0);osc("sine",130,32,t+.16,.9,1,0);osc("sine",60,30,t,1.6,.9,0);noise(t,.9,.45,"highpass",3000);[262,330,392,523].forEach((f,i)=>{osc("sawtooth",f,0,t+.1+i*.12,1.1,.14,40);osc("sawtooth",f*1.01,0,t+.1+i*.12,1.1,.1,40);});osc("sawtooth",65,0,t,1.6,.35,60);}
else if(k==="dmg"){osc("sawtooth",110,34,t,.8,.5,60);noise(t,.45,.6,"lowpass",450);osc("sine",90,28,t,.8,1,0);}
else if(k==="lose"){osc("sawtooth",220,45,t,2,.35,80);osc("sawtooth",165,38,t+.05,2,.3,80);osc("sine",55,24,t,2.2,1,0);osc("sine",70,26,t+.5,1.4,.9,0);noise(t,1,.5,"lowpass",250);}
}catch(e){}}
let cm="none";
let forceOne=false;
function roll(){const m=S.mode;if(m==="rush"&&forceOne){forceOne=false;return"one";}if(m==="rush"&&Math.random()<P.one)return"one";if(Math.random()<P.blank)return"blank";return Math.random()<(m==="chal"?P.a1:P.a2)?"atk":"dmg";}
function cueFor(o){if(!o)return"";

async function pull(){
S.pre=(S.mode==="chal"||S.mode==="rush")?roll():null;

async function rainbow(num){

ov.className="ichi on";

setTimeout(()=>{ov.className="ichi";$("push").classList.remove("down");},900);}
async function draw(cue,one){

{const rg=$("rg");if(rg&&m==="rush")rg.innerHTML=[0,0,0].map(()=>`<b>${1+Math.floor(Math.random()*9)}</b>`).join("");}
